<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#30363d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; letter-spacing: 2.5px; font-size: 32px; }
    .role { font-weight: 500; fill: #38bdf8; letter-spacing: 1.5px; font-size: 13px; }
    .desc { font-weight: 400; fill: #8b949e; font-size: 14px; }
    .path { font-weight: 400; fill: #6e7681; font-size: 12px; }
    .badge-text { font-weight: 600; fill: #7dd3fc; font-size: 11px; letter-spacing: 1px; }
  </style>

  <!-- Base Container -->
  <rect x="1" y="1" width="898" height="248" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Subtle Grid Fill -->
  <rect x="1" y="1" width="898" height="248" rx="12" fill="url(#grid)"/>

  <!-- Radial Glow Behind Text -->
  <circle cx="450" cy="140" r="280" fill="url(#center-glow)"/>

  <!-- macOS Window Header Bar -->
  <path d="M 1 13 C 1 6.37 6.37 1 13 1 L 887 1 C 893.63 1 899 6.37 899 13 L 899 38 L 1 38 Z" fill="#141820" fill-opacity="0.8"/>
  <line x1="1" y1="38" x2="899" y2="38" stroke="#21262d" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="24" cy="19" r="5.5" fill="#ff5f56" fill-opacity="0.85"/>
  <circle cx="42" cy="19" r="5.5" fill="#ffbd2e" fill-opacity="0.85"/>
  <circle cx="60" cy="19" r="5.5" fill="#27c93f" fill-opacity="0.85"/>

  <!-- Window Title / Command Bar -->
  <text x="450" y="24" text-anchor="middle" class="mono path">narainram@systems-core: ~/portfolio</text>

  <!-- Status Pill -->
  <g transform="translate(330, 58)">
    <rect x="0" y="0" width="240" height="24" rx="12" fill="#0c2338" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="14" cy="12" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="127" y="16" text-anchor="middle" class="mono badge-text">SYSTEMS • AI • ROBOTICS</text>
  </g>

  <!-- Hero Name -->
  <text x="450" y="125" text-anchor="middle" class="sans title">NARAIN RAM R M</text>

  <!-- Core Positioning Line -->
  <text x="450" y="155" text-anchor="middle" class="mono role">SOFTWARE ENGINEER  •  AI &amp; ROBOTICS  •  FULL-STACK</text>

  <!-- Value Proposition -->
  <text x="450" y="188" text-anchor="middle" class="sans desc">Architecting resilient backend systems, low-level concurrency utilities, and autonomous robotics.</text>

  <!-- Terminal Status Footer Line -->
  <text x="450" y="218" text-anchor="middle" class="mono path">
    <tspan fill="#38bdf8">&gt;</tspan> Java 21 · Spring Boot 3 · Modern C++17 · ROS · PostgreSQL · Qdrant · React
  </text>
</svg>
